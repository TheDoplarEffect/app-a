name: release
on:
  push:
    branches: [master]
permissions:
  contents: write
env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compute release tag
        id: tag
        run: echo "tag=v$(awk '/versionName/ {gsub(/"/, ""); print $2}' app/build.gradle)-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Ensure Android SDK components
        run: |
          SDK="$ANDROID_SDK_ROOT"
          CTL="$SDK/cmdline-tools/latest/bin"
          if [ ! -x "$CTL/sdkmanager" ]; then
            mkdir -p "$SDK/cmdline-tools"
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/clt.zip
            unzip -q /tmp/clt.zip -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
            CTL="$SDK/cmdline-tools/latest/bin"
          fi
          yes | "$CTL/sdkmanager" --licenses > /dev/null
          "$CTL/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore
      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tee build-ci.log
      - uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          draft: ${{ job.status != 'success' }}
          files: |
            app/build/outputs/apk/release/*.apk
            build-ci.log
          fail_on_unmatched_files: false
